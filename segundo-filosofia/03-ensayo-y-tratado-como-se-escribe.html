<title>Quiz Ensayo y tratado Filosofía 2 BGU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: quiz de estudio por estaciones. Una pregunta por pantalla, nota sobre 10 por estación y una tarjeta de resultado pensada para capturar y enviar por la plataforma. */
:root{--bg:#F3F4F8;--surface:#FFFFFF;--fg:#15192B;--muted:#586079;--line:#CCD2E0;--accent:#3A4EA3;--accent-soft:#DFE5F7;--ok:#1E7B46;--ok-soft:#DCF0E3;--bad:#B3321F;--bad-soft:#F8DED9;--warm:#8F5A06;--warm-soft:#F7EACB;--onacc:#FFFFFF;
--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1422;--surface:#181F33;--fg:#ECEFF7;--muted:#A9B2C7;--line:#2D3855;--accent:#8FA8F5;--accent-soft:#1F2D52;--ok:#6CD39A;--ok-soft:#173A27;--bad:#F2876F;--bad-soft:#3A1D18;--warm:#E9B04F;--warm-soft:#3B2D12;--onacc:#0F1422;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1422;--surface:#181F33;--fg:#ECEFF7;--muted:#A9B2C7;--line:#2D3855;--accent:#8FA8F5;--accent-soft:#1F2D52;--ok:#6CD39A;--ok-soft:#173A27;--bad:#F2876F;--bad-soft:#3A1D18;--warm:#E9B04F;--warm-soft:#3B2D12;--onacc:#0F1422;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:clamp(17px,2.6vw,20px);line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:.2em 0 .4em;text-wrap:balance}h1{font-size:1.8em}h2{font-size:1.4em}h3{font-size:1.1em}
p{margin:.45em 0}.muted{color:var(--muted)}.small{font-size:.82em}
.tag{font-size:.74em;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--warm);margin:0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:.45em 0 .9em}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.8em 1em;margin:.7em 0}
button,input{font:inherit;color:var(--fg)}
button{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;min-height:48px;text-align:left}
button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:700;text-align:center}
button:disabled{opacity:.5;cursor:not-allowed}
.op{display:block;width:100%;margin:.45em 0}.op.ok{background:var(--ok-soft);border-color:var(--ok)}.op.bad{background:var(--bad-soft);border-color:var(--bad)}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin:.6em 0}.row>*{min-width:0}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:.6em}.tfrow button{text-align:center;font-weight:700}
input[type=text]{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6em .8em;min-height:48px}
label{display:block;font-weight:700;font-size:.9em;margin:.7em 0 .2em}
.fb{border-radius:12px;padding:.6em .9em;margin:.7em 0;font-size:.95em}.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)}.fb.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:.5em;margin:.5em 0}.chips button{flex:1 1 100%}
.seq{counter-reset:s;display:grid;gap:.4em;margin:.5em 0;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:.5em}
.seq button{counter-increment:s;background:var(--accent-soft);border-color:var(--accent)}.seq button::before{content:counter(s) ". ";font-weight:700}
.st{display:grid;grid-template-columns:1fr auto;gap:.6em;align-items:center}
.score{font-family:var(--serif);font-size:2.4em;font-weight:700;line-height:1;white-space:nowrap}
.cap{border:3px solid var(--accent);border-radius:16px;background:var(--surface);padding:1em 1.1em;margin:.7em 0}
.cap .big{font-family:var(--serif);font-size:3.4em;font-weight:700;line-height:1;color:var(--accent)}
.lv{display:inline-block;font-weight:700;border-radius:999px;padding:.15em .8em;font-size:.85em}.s-hi{background:var(--ok-soft);color:var(--ok)}.s-mid{background:var(--warm-soft);color:var(--warm)}.s-lo{background:var(--bad-soft);color:var(--bad)}
.alert{background:var(--warm-soft);border:2px solid var(--warm);border-radius:12px;padding:.7em .9em;font-weight:700;margin:.7em 0}
details{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.4em 1em;margin:.7em 0}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details ul{margin:.3em 0 .6em;padding-left:1.2em}details li{margin:.4em 0}
table{width:100%;border-collapse:collapse;font-size:.92em}th,td{padding:.45em .5em;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.miss{border-top:2px solid var(--line);padding:.5em 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.chips button{flex:1 1 45%}}
</style>


<div id="app"></div>
<script>
var DATA={"id": "f11", "nombre": "Filosofía", "curso": "2 BGU", "titulo": "Quiz de estudio: ensayo y tratado", "sub": "Antes de la clase: cómo se escribe un ensayo, con una pregunta de Ecuador", "st": [{"n": "Ensayo y tratado", "tag": "Estación única", "repaso": ["El ensayo es un texto breve con voz personal: defiende una opinión con razones. Michel de Montaigne publicó sus Ensayos en 1580.", "El tratado suele ser más extenso, ordenado y sistemático; trata un tema de forma completa.", "Partes del ensayo: introducción con tesis, argumentos (al menos dos), ejemplo propio y conclusión.", "La tesis es la idea que defiendo; un argumento es una razón que la apoya.", "Juan Montalvo (Ambato, 1832–1889) es recordado como uno de los grandes ensayistas del Ecuador.", "La IA puede ayudar a consultar, pero el ensayo lo escribe cada estudiante con sus palabras."], "qs": [{"t": "mc", "q": "¿Qué es la tesis de un ensayo?", "o": ["La idea principal que el autor defiende", "La lista de libros consultados", "El título del texto", "El último párrafo"], "e": "La tesis es la postura que se defiende en todo el ensayo."}, {"t": "mc", "q": "¿Qué es un argumento?", "o": ["Una razón que apoya la tesis", "Una pelea entre dos personas", "Un dibujo", "Una pregunta sin respuesta"], "e": "El argumento sostiene la tesis con razones."}, {"t": "tf", "q": "Un tratado suele ser más extenso y sistemático que un ensayo.", "a": true, "e": "Sí. El ensayo es breve y personal; el tratado, más completo y ordenado."}, {"t": "mc", "q": "Michel de Montaigne publicó en 1580…", "o": ["los Ensayos", "el Discurso del método", "el Código de Hammurabi", "la Constitución"], "e": "Con sus Ensayos nació este género en Europa."}, {"t": "order", "q": "Ordena las partes de un ensayo.", "items": ["Introducción con tesis", "Primer argumento", "Segundo argumento", "Conclusión"], "e": "Introducción con tesis → argumento 1 → argumento 2 → conclusión."}, {"t": "mc", "q": "Juan Montalvo es recordado como…", "o": ["ensayista ecuatoriano, nacido en Ambato", "conquistador del Tahuantinsuyo", "presidente de Colombia", "astrónomo de Quito"], "e": "Nació en Ambato en 1832 y es uno de los grandes ensayistas del país."}, {"t": "tf", "q": "En un ensayo filosófico basta con copiar lo que responde la IA.", "a": false, "e": "Falso. La IA puede orientar la consulta, pero el ensayo debe escribirse con las propias palabras."}, {"t": "mc", "q": "¿Qué ejemplo local sirve para el ensayo “¿minga o cada quien por su lado?”", "o": ["El arreglo de un camino del barrio mediante una minga", "La biografía de Descartes", "Una receta de cocina", "Un partido de fútbol de otra ciudad"], "e": "Un ejemplo cercano hace más fuerte el argumento."}]}]};

</script>
<script>
var app=document.getElementById("app");
var NQ=10;
var S={name:"",curso:"",res:[],att:[],cur:null};
try{S.name=localStorage.getItem("qn-name-"+DATA.id)||"";S.curso=localStorage.getItem("qn-curso-"+DATA.id)||""}catch(e){}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fm(x){return (Math.round(x*10)/10).toFixed(1).replace(".",",")}
function lvl(x){if(x>=9)return["Domina los aprendizajes requeridos (DA)","s-hi"];if(x>=7)return["Alcanza los aprendizajes requeridos (AA)","s-hi"];if(x>4)return["Próximo a alcanzar los aprendizajes (PAA)","s-mid"];return["No alcanza los aprendizajes requeridos (NAA)","s-lo"]}
function stamp(){var d=new Date();function z(n){return(n<10?"0":"")+n}return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" · "+z(d.getHours())+":"+z(d.getMinutes())}
function save(){try{localStorage.setItem("qn-name-"+DATA.id,S.name);localStorage.setItem("qn-curso-"+DATA.id,S.curso)}catch(e){}}
function head(){return'<p class="tag">'+DATA.nombre+" · "+DATA.curso+"</p>"}
function home(msg){
 var h=head()+"<h1>"+esc(DATA.titulo)+"</h1><p class=\"muted\">"+esc(DATA.sub)+"</p>";
 h+='<div class="card"><label for="nm">Nombre y apellido</label><input type="text" id="nm" autocomplete="name" value="'+esc(S.name)+'"><label for="cu">Curso y paralelo (ej.: 2 BGU A)</label><input type="text" id="cu" value="'+esc(S.curso)+'">';
 if(msg)h+='<p style="color:var(--bad);font-weight:700">'+msg+"</p>";
 h+="</div>";
 h+='<p class="small muted">Cada estación vale 10 puntos: 10 preguntas al azar de un banco de 14. Puedes repasar la ficha antes de empezar y repetir las veces que quieras. Al final de cada estación aparece tu nota para capturarla y enviarla por la plataforma.</p>';
 DATA.st.forEach(function(s,i){
  var r=S.res[i];
  h+='<div class="card st"><div><p class="tag">'+s.tag+"</p><h3>"+esc(s.n)+'</h3><p class="small muted">'+(r!=null?"Mejor nota: "+fm(r)+" / 10 · Intentos: "+S.att[i]:"Aún sin intentar")+'</p></div><button class="pri" data-i="'+i+'" data-a="go">'+(r!=null?"Repetir":"Entrar")+"</button></div>"});
 h+='<div class="row"><button class="pri" data-a="sum">Ver resumen de mis notas</button></div>';
 app.innerHTML=h;
 app.querySelectorAll("[data-a=go]").forEach(function(b){b.onclick=function(){
  S.name=document.getElementById("nm").value.trim();S.curso=document.getElementById("cu").value.trim();save();
  if(!S.name||!S.curso){home("Escribe tu nombre y tu curso para entrar. Aparecerán en tu nota.");return}
  intro(+b.getAttribute("data-i"))}});
 app.querySelector("[data-a=sum]").onclick=function(){S.name=document.getElementById("nm").value.trim();S.curso=document.getElementById("cu").value.trim();save();summary()};
 window.scrollTo(0,0)}
function intro(i){
 var s=DATA.st[i];
 var h=head()+'<p class="tag">'+s.tag+"</p><h1>"+esc(s.n)+"</h1>";
 h+='<details open><summary>Repasa antes de empezar</summary><ul>'+s.repaso.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul></details>";
 h+='<p class="small muted">Son 10 preguntas con retroalimentación inmediata. Cada una vale 1 punto.</p><div class="row"><button class="pri" data-a="start">Comenzar</button><button data-a="back">Volver</button></div>';
 app.innerHTML=h;
 app.querySelector("[data-a=start]").onclick=function(){start(i)};
 app.querySelector("[data-a=back]").onclick=function(){home()};
 window.scrollTo(0,0)}
function start(i){
 var qs=sh(DATA.st[i].qs).slice(0,NQ);
 S.cur={i:i,qs:qs,k:0,pts:0,miss:[],done:false};ask()}
function ask(){
 var c=S.cur,q=c.qs[c.k];c.done=false;c.sel=[];
 var h=head()+'<p class="tag">'+DATA.st[c.i].tag+" · Pregunta "+(c.k+1)+" de "+c.qs.length+'</p><div class="bar"><i style="width:'+Math.round(c.k/c.qs.length*100)+'%"></i></div><h2>'+esc(q.q)+"</h2>";
 if(q.t==="mc"){c.opts=sh(q.o.map(function(t,ix){return{t:t,ok:ix===0}}));h+=c.opts.map(function(o,ix){return'<button class="op" data-o="'+ix+'">'+esc(o.t)+"</button>"}).join("")}
 else if(q.t==="tf"){h+='<div class="tfrow"><button data-v="1">Verdadero</button><button data-v="0">Falso</button></div>'}
 else{c.shuf=sh(q.items.map(function(t,ix){return{t:t,ix:ix}}));h+='<p class="small muted">Toca los hechos en el orden correcto, del primero al último. Toca uno de tu lista para quitarlo.</p><div class="seq" id="seq"></div><div class="chips" id="chips"></div><div class="row"><button class="pri" id="chk" disabled>Comprobar</button></div>'}
 h+='<div id="fb"></div>';
 app.innerHTML=h;
 if(q.t==="mc")app.querySelectorAll(".op").forEach(function(b){b.onclick=function(){answerMc(+b.getAttribute("data-o"))}});
 else if(q.t==="tf")app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){answerTf(b.getAttribute("data-v")==="1")}});
 else drawOrder();
 window.scrollTo(0,0)}
function finishQ(ok,exp){
 var c=S.cur,q=c.qs[c.k];c.done=true;if(ok)c.pts++;else c.miss.push(q);
 var fb=document.getElementById("fb");
 fb.innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"¡Correcto!":"Revisa esto.")+"</b> "+esc(exp)+'</div><div class="row"><button class="pri" id="nx">'+(c.k+1<c.qs.length?"Siguiente":"Ver mi nota")+"</button></div>";
 var nx=document.getElementById("nx");nx.onclick=function(){c.k++;if(c.k<c.qs.length)ask();else result()};nx.focus()}
function answerMc(ix){var c=S.cur,q=c.qs[c.k];if(c.done)return;
 app.querySelectorAll(".op").forEach(function(b,j){b.disabled=true;if(c.opts[j].ok)b.classList.add("ok");else if(j===ix)b.classList.add("bad")});
 finishQ(c.opts[ix].ok,q.e)}
function answerTf(v){var c=S.cur,q=c.qs[c.k];if(c.done)return;
 app.querySelectorAll("[data-v]").forEach(function(b){b.disabled=true;var bv=b.getAttribute("data-v")==="1";if(bv===q.a)b.classList.add("op","ok");else if(bv===v)b.classList.add("op","bad")});
 finishQ(v===q.a,(v===q.a?"":"La respuesta es "+(q.a?"Verdadero":"Falso")+". ")+q.e)}
function drawOrder(){
 var c=S.cur,seq=document.getElementById("seq"),ch=document.getElementById("chips"),chk=document.getElementById("chk");
 seq.innerHTML=c.sel.map(function(ix,p){return'<button data-r="'+p+'">'+esc(c.qs[c.k].items[ix])+"</button>"}).join("");
 ch.innerHTML=c.shuf.filter(function(o){return c.sel.indexOf(o.ix)<0}).map(function(o){return'<button data-a="'+o.ix+'">'+esc(o.t)+"</button>"}).join("");
 chk.disabled=c.sel.length!==c.shuf.length;
 ch.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(c.done)return;c.sel.push(+b.getAttribute("data-a"));drawOrder()}});
 seq.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(c.done)return;c.sel.splice(+b.getAttribute("data-r"),1);drawOrder()}});
 chk.onclick=function(){if(c.done)return;var ok=c.sel.every(function(v,p){return v===p});
  seq.querySelectorAll("button").forEach(function(b){b.disabled=true});chk.disabled=true;
  var q=c.qs[c.k];finishQ(ok,(ok?"":"El orden correcto es: "+q.items.map(function(t,p){return(p+1)+") "+t}).join(" · ")+". ")+q.e)}}
function result(){
 var c=S.cur,i=c.i,sc=c.pts;
 S.att[i]=(S.att[i]||0)+1;S.res[i]=S.res[i]==null?sc:Math.max(S.res[i],sc);
 var L=lvl(sc);
 var h='<p class="tag">'+DATA.st[i].tag+" · Resultado</p>";
 h+='<div class="cap"><p class="tag">'+DATA.nombre+" · "+DATA.curso+"</p><h2>"+esc(DATA.st[i].n)+'</h2><p><b>Estudiante:</b> '+esc(S.name)+"<br><b>Curso:</b> "+esc(S.curso)+"<br><b>Fecha y hora:</b> "+stamp()+"<br><b>Intento:</b> "+S.att[i]+'</p><div class="big">'+sc+' <span style="font-size:.4em">/ 10</span></div><p><span class="lv '+L[1]+'">'+L[0]+"</span></p></div>";
 h+='<div class="alert">Toma una captura de pantalla de esta nota (con tu nombre, la fecha y la hora) y envíala por la plataforma.</div>';
 if(c.miss.length){h+="<h3>Para repasar ("+c.miss.length+")</h3><div class=\"card\">"+c.miss.map(function(q){var r=q.t==="mc"?q.o[0]:q.t==="tf"?(q.a?"Verdadero":"Falso"):q.items.map(function(t,p){return(p+1)+") "+t}).join(" · ");return'<div class="miss"><b>'+esc(q.q)+"</b><br>Respuesta: "+esc(r)+"<br><span class=\"muted\">"+esc(q.e)+"</span></div>"}).join("")+"</div>"}
 else h+='<p><b>Sin errores.</b> Excelente repaso.</p>';
 h+='<div class="row"><button class="pri" id="rt">Repetir con otras preguntas</button><button id="rv">Repasar la ficha</button><button id="hm">Volver a las estaciones</button></div>';
 app.innerHTML=h;
 document.getElementById("rt").onclick=function(){start(i)};
 document.getElementById("rv").onclick=function(){intro(i)};
 document.getElementById("hm").onclick=function(){home()};
 window.scrollTo(0,0)}
function summary(){
 var done=0,tot=0;DATA.st.forEach(function(s,i){if(S.res[i]!=null){done++;tot+=S.res[i]}});
 var h=head()+"<h1>Resumen de mis notas</h1>";
 h+='<div class="cap"><p><b>Estudiante:</b> '+esc(S.name||"—")+"<br><b>Curso:</b> "+esc(S.curso||"—")+"<br><b>Fecha y hora:</b> "+stamp()+'</p><table><thead><tr><th>Estación</th><th class="n">Mejor nota</th><th class="n">Intentos</th></tr></thead><tbody>'+DATA.st.map(function(s,i){return"<tr><td>"+esc(s.n)+'</td><td class="n">'+(S.res[i]!=null?fm(S.res[i])+" / 10":"—")+'</td><td class="n">'+(S.att[i]||0)+"</td></tr>"}).join("")+"</tbody></table>"+(done?'<p><b>Promedio de las estaciones hechas ('+done+" de "+DATA.st.length+"):</b> "+fm(tot/done)+" / 10</p>":"<p class=\"muted\">Aún no has hecho ninguna estación.</p>")+"</div>";
 h+='<div class="alert">Toma una captura de pantalla de cada estación al terminarla y envíala por la plataforma. Este resumen es solo para ti.</div><div class="row"><button class="pri" id="hm">Volver a las estaciones</button></div>';
 app.innerHTML=h;document.getElementById("hm").onclick=function(){home()};window.scrollTo(0,0)}
home();

</script>
