<script>
/* Museo del Tiempo · Estudio con nota · Estaciones 3 y 4 (Octavo EGB). Cada estación suma 10 puntos. */
function mc(id,pts,q,right,wrongs,why,x,ctx){return {id:id,type:'mc',kind:'Selección múltiple',pts:pts,q:q,ctx:ctx||'',o:[right].concat(wrongs),why:why,x:x||''}}
var PART={key:'museo_notas_p2_v1',label:'Estaciones 3 y 4',ST:[
{id:'s3',n:3,name:'Sala del Pensamiento',sub:'La plaza de las ideas',
 study:[
  {t:'El Mediterráneo, cuna de culturas',p:'Alrededor del mar Mediterráneo florecieron pueblos que influyeron en el mundo: los <b>fenicios</b> (navegantes y comerciantes; su alfabeto fue base de los alfabetos griego y latino), los <b>griegos</b> (democracia y filosofía), los <b>romanos</b> (leyes, latín e imperio) y los <b>hebreos</b> (de su región nació el cristianismo).'},
  {t:'Grecia: ciudades-Estado',p:'Los griegos vivían en <b>polis</b> (ciudades-Estado) independientes. Las más famosas: <b>Atenas</b>, que desarrolló la democracia, las artes y la filosofía, y <b>Esparta</b>, que educaba a sus jóvenes para la guerra. De Grecia vienen también el teatro y los <b>Juegos Olímpicos</b>.'},
  {t:'La democracia ateniense',p:'«Democracia» viene de <i>demos</i> (pueblo) y <i>kratos</i> (poder): gobierno del pueblo. En Atenas los ciudadanos debatían y votaban en la asamblea, en una plaza pública llamada <b>ágora</b>. Pero solo votaban los <b>varones adultos ciudadanos</b>: quedaban fuera las mujeres, los extranjeros y los esclavos. Hoy votan hombres y mujeres adultos; en el Ecuador el voto es obligatorio de 18 a 64 años. Matilde Hidalgo, en 1924, fue la primera mujer en votar en el país.'},
  {t:'La filosofía: de los mitos a la razón',p:'<b>Filosofía</b> significa «amor por la sabiduría». Los filósofos griegos empezaron a explicar el mundo con preguntas y razones, no solo con mitos. <b>Tales de Mileto</b> pensaba que el agua era el origen de todo. <b>Sócrates</b> dialogaba y preguntaba en el ágora. <b>Platón</b> escribió <i>La República</i> y fundó la Academia. <b>Aristóteles</b> fundó el Liceo, estudió la naturaleza y la lógica, y fue maestro de Alejandro Magno.'},
  {t:'Roma y su herencia',p:'Roma pasó de ser una ciudad a un gran imperio. Dejó el <b>latín</b> (del que nace el español), el <b>derecho romano</b> (base de muchas leyes actuales) y obras como <b>acueductos y calzadas</b>. Su unidad facilitó que nuevas ideas, como el cristianismo, viajaran por todo el Mediterráneo.'},
  {t:'El cristianismo en el Imperio romano',p:'El cristianismo nació en <b>Judea</b>, provincia romana. Jesús de Nazaret enseñó el amor al prójimo y que todas las personas tienen la misma dignidad. Las primeras comunidades ayudaban a los pobres, y entre ellas había esclavos y mujeres. Las autoridades romanas los veían como un problema porque <b>no rendían culto al emperador ni a los dioses romanos</b> y predicaban la igualdad.'},
  {t:'De la persecución a la religión oficial',p:'Nerón culpó a los cristianos del incendio de Roma (año 64). Diocleciano ordenó una gran persecución (303). El emperador Constantino dio <b>libertad de culto</b> con el <b>Edicto de Milán</b> (313). Con el Edicto de Tesalónica, el emperador Teodosio hizo del cristianismo la religión oficial (380).'},
  {t:'Humanismo y respeto a la diversidad',wide:true,p:'El <b>humanismo</b> pone a la persona en el centro: toda persona tiene <b>dignidad</b> y valor. De Grecia heredamos el diálogo y la razón; del cristianismo, la igualdad y la solidaridad. Estas ideas son base de la <b>tolerancia</b>. La Constitución del Ecuador reconoce la libertad de creencias y define al Estado como intercultural, plurinacional y laico.'}],
 qs:[
  {id:'3a',type:'order',kind:'Ordenamiento',pts:1.0,q:'Ordena la cadena de maestros: cada uno fue maestro del siguiente. Empieza por el más antiguo (1).',
   items:['Sócrates','Platón','Aristóteles','Alejandro Magno'],
   why:'Sócrates fue maestro de Platón; Platón, de Aristóteles; y Aristóteles, de Alejandro Magno.',
   x:'Platón fundó la Academia y Aristóteles el Liceo: de ahí viene la idea de «escuela».'},
  mc('3b',0.6,'Los fenicios eran grandes navegantes y comerciantes del Mediterráneo. ¿Qué aporte suyo seguimos usando hoy?','Su alfabeto, que fue base de los alfabetos griego y latino',['La democracia','El Código de Hammurabi','Los números romanos'],
     'Los fenicios difundieron un alfabeto sencillo con signos para sonidos, muy fácil de aprender.',
     'Gracias a su comercio, ese alfabeto viajó por todo el Mediterráneo.'),
  mc('3c',0.6,'¿Qué distinguía a Atenas de Esparta?','Atenas desarrolló la democracia, las artes y la filosofía; Esparta educaba a sus jóvenes para la guerra',['Atenas educaba a sus jóvenes para la guerra y Esparta desarrolló la democracia','Las dos tenían el mismo gobierno y la misma educación','Esparta inventó la filosofía y Atenas el cristianismo'],
     'Eran ciudades griegas muy distintas: Atenas, más abierta al debate y a las artes; Esparta, muy militar.',
     'Atenas era la ciudad de la diosa Atenea, de ahí su nombre.'),
  mc('3d',0.6,'En la ágora de Atenas, un ciudadano propone una ley y los demás debaten y votan. ¿Qué forma de gobierno se practicaba?','Democracia: los ciudadanos participaban y decidían con su voto',['Teocracia: gobernaban los sacerdotes','Monarquía: mandaba un solo rey por herencia','Oligarquía: decidían pocas familias ricas'],
     'La democracia ateniense era directa: los ciudadanos votaban las decisiones en la asamblea.',
     'Aun así, no todos eran ciudadanos: mujeres, extranjeros y esclavos no votaban.'),
  mc('3e',0.6,'En Atenas votaba solo una parte de la población. En el Ecuador de hoy, ¿quiénes votan?','Hombres y mujeres adultos: el voto es obligatorio de 18 a 64 años',['Solo los hombres con dinero','Solo los nacidos en Quito','Solo quienes tienen título universitario'],
     'La democracia moderna amplió el derecho al voto a mujeres y hombres. En el Ecuador, a los 16 y 17 años y desde los 65 el voto es opcional.',
     'Matilde Hidalgo votó en Machala en 1924: fue la primera mujer ecuatoriana en hacerlo.'),
  mc('3f',0.6,'¿Qué cambio trajo la filosofía griega?','Empezar a explicar el mundo con preguntas y razones, no solo con mitos',['Dejar de usar el diálogo','Prohibir toda pregunta','Aceptar sin dudar lo que dijeran los reyes'],
     'Los filósofos observaron, preguntaron y argumentaron: así nació el pensamiento racional.',
     'Muchas ciencias actuales nacieron de preguntas de los filósofos griegos.'),

{id:'s4',n:4,name:'Sala del Medioevo',sub:'El feudo y el cambio',
 study:[
  {t:'Del Imperio romano al feudalismo',p:'En el año 476 cayó el Imperio romano de Occidente. Siguieron años de invasiones e inseguridad: las personas buscaban protección. Los reyes eran débiles y el poder quedó en manos de los grandes propietarios de tierras, los <b>señores feudales</b>. Así nació el <b>feudalismo</b>.'},
  {t:'Feudo, señor y vasallo',p:'Un <b>feudo</b> era una tierra que un señor entregaba a un <b>vasallo</b> a cambio de fidelidad y ayuda militar. El señor daba <b>tierra y protección</b>; el vasallo juraba <b>fidelidad y servicio</b> en la guerra. Los vasallos más conocidos eran los <b>caballeros</b>, guerreros a caballo.'},
  {t:'La sociedad feudal',p:'Se decía que había tres grupos: «los que rezan» (el <b>clero</b>), «los que luchan» (los nobles y caballeros) y «los que trabajan» (los <b>campesinos y siervos</b>). En la cima estaban el rey y los grandes señores; en la base, los siervos. Casi todos vivían en el campo, en aldeas.'},
  {t:'El siervo: trabajo y obligaciones',p:'El <b>siervo</b> trabajaba la tierra del señor y no podía abandonarla. Debía entregar parte de la cosecha, trabajar gratis algunos días en las tierras del señor (llamado <b>corvea</b>) y pagar por usar el molino o el horno del señor. Vivía en una casa pequeña y comía sobre todo pan y sopa. A cambio recibía protección y un pedazo de tierra para sobrevivir.'},
  {t:'El poder de la Iglesia',p:'El <b>clero</b> tenía gran poder: poseía tierras, dirigía la vida religiosa y cobraba el <b>diezmo</b> (la décima parte de la cosecha). En los <b>monasterios</b>, los monjes rezaban, enseñaban y copiaban libros a mano, y así se conservó mucho conocimiento antiguo.'},
  {t:'El castillo y la vida en el feudo',p:'El <b>castillo</b> era la casa del señor, un refugio en caso de ataque y el centro del poder. Alrededor se extendían los campos, el bosque, el molino y la aldea. Era una economía de <b>autoabastecimiento</b>: casi todo se producía en el propio feudo y se comerciaba muy poco.'},
  {t:'¿Por qué hablamos de explotación?',p:'Porque quien trabajaba no decidía ni recibía un pago justo: la mayor parte del beneficio quedaba para el señor y para la Iglesia. La relación era <b>desigual</b>, sostenida por la tierra y por la fuerza.'},
  {t:'Mirando al Ecuador',wide:true,p:'En muchas haciendas de la Sierra ecuatoriana existieron relaciones parecidas: familias que trabajaban para el dueño de la tierra a cambio de un pequeño terreno (huasipungo) o quedaban atadas a la hacienda por deudas. La Ley de Reforma Agraria de 1964 buscó terminar con estos sistemas. Comparar épocas distintas nos ayuda a reconocer cuando una relación es injusta.'}],
 qs:[
  {id:'4a',type:'order',kind:'Ordenamiento',pts:1.0,q:'Ordena cómo se formó el feudalismo, del primer hecho (1) al último (4).',

   x:'La fecha tradicional de la caída del Imperio romano de Occidente es el año 476.'},
  mc('4b',0.6,'Después de la caída del Imperio romano de Occidente, Europa vivió años de inseguridad. ¿Qué pasó con el poder?','Se fragmentó: quedó en manos de grandes propietarios de tierras, los señores feudales',['Se concentró en un solo emperador mundial','Pasó a manos de los comerciantes de las ciudades','Se repartió por votación entre todos los habitantes'],
     'Sin un Estado fuerte, la gente buscó protección en los señores que tenían tierras y soldados.',

  mc('4c',0.6,'¿Qué era un feudo?','Una tierra que un señor entregaba a un vasallo a cambio de fidelidad y ayuda militar',['Una ciudad amurallada llena de comerciantes','Un impuesto que se pagaba a Roma','Una escuela de monjes'],

     'Su vida era dura: trabajo constante, casa pequeña y pocos derechos.',
     'Comía sobre todo pan, sopa y verduras.'),
  mc('4j',0.6,'¿Qué era el diezmo?','La décima parte de la cosecha que se entregaba a la Iglesia',['Un castigo para los caballeros','Un impuesto que cobraban los comerciantes','El nombre de un castillo'],
     'El diezmo sostenía a la Iglesia y reforzaba su poder.',
     'La palabra viene de «diez».'),
  mc('4k',0.6,'¿Por qué decimos que la relación entre el señor y el siervo era de explotación?','Porque el beneficio quedaba para el señor y quien trabajaba no decidía ni recibía un pago justo',['Porque el siervo mandaba sobre el señor','Porque el siervo era dueño de toda la tierra','Porque no se trabajaba en el feudo'],
     'Había intercambio, pero muy desigual: quien trabajaba tenía pocos derechos.',

  mc('4l',0.6,'En una hacienda de la Sierra ecuatoriana, una familia debía trabajar para el dueño y no podía irse por sus deudas. ¿Qué parecido tiene con la servidumbre feudal?','Quien trabajaba dependía de la tierra y del dueño y no era realmente libre',['Los trabajadores mandaban en la hacienda','Los trabajadores recibían sueldos muy altos','Todos eran dueños de la tierra'],
