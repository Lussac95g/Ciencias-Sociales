<script>
/* Museo del Tiempo · Estudio con nota · Estaciones 1 y 2 (Octavo EGB). Cada estación suma 10 puntos. */
function mc(id,pts,q,right,wrongs,why,x,ctx){return {id:id,type:'mc',kind:'Selección múltiple',pts:pts,q:q,ctx:ctx||'',o:[right].concat(wrongs),why:why,x:x||''}}
var PART={key:'museo_notas_p1_v1',label:'Estaciones 1 y 2',ST:[
{id:'s1',n:1,name:'Sala de los Orígenes',sub:'El curador de la historia',
 study:[
  {t:'¿Para qué sirve la historia?',p:'La historia nos cuenta cómo vivían las personas del pasado y por qué el mundo de hoy es como es. Los historiadores usan <b>fuentes</b>: <b>escritas</b> (cartas, leyes), <b>orales</b> (relatos de los abuelos), <b>materiales</b> (vasijas, herramientas, ruinas) y <b>visuales</b> (pinturas, fotos). En el Ecuador, Ingapirca, la cerámica de Valdivia y el Inti Raymi nos hablan de nuestros antepasados.'},
  {t:'Así empezó la humanidad',p:'Los primeros seres humanos aparecieron en <b>África</b> hace millones de años. Desde allí, grupos humanos fueron saliendo y poblaron todos los continentes. A América llegaron hace más de 15 000 años, desde Asia, por una franja de tierra que hoy cubre el mar en el estrecho de Bering. Por eso decimos que toda la humanidad tiene un <b>origen común</b>.'},
  {t:'El trabajo nos hizo humanos',p:'Trabajar es transformar la naturaleza para poder vivir. Fabricar herramientas de piedra, usar el fuego y cazar y recolectar en grupo desarrolló el cerebro, el lenguaje y la cooperación. Las personas aprendían unas de otras y transmitían lo aprendido: así avanzó la sociedad.'},
  {t:'Paleolítico y Neolítico',p:'En el <b>Paleolítico</b> las personas eran <b>nómadas</b>: cazaban, pescaban y recolectaban, y se movían buscando alimento. En el <b>Neolítico</b> (hace unos 10 000 años) aprendieron a sembrar y a criar animales y se volvieron <b>sedentarias</b>: se quedaron en un lugar y formaron <b>aldeas</b>.'},
  {t:'La mujer y la agricultura',p:'Las mujeres solían ser recolectoras: conocían las plantas, las semillas y las estaciones. Al observar cómo crecían, ayudaron a descubrir cómo sembrar y cuidar los cultivos. En los Andes se cultivó la papa y en América el maíz. En la costa del Ecuador, la cultura <b>Valdivia</b> (hace más de 4 000 años) vivía en aldeas, cultivaba y hacía cerámica, como las famosas figuritas femeninas llamadas «Venus de Valdivia».'},
  {t:'La agricultura cambió la vida',p:'Con la agricultura se producían <b>excedentes</b> (alimento que sobra). Eso permitió guardar comida y que algunas personas se dedicaran a otros oficios (artesanos, sacerdotes, jefes). Así aparecieron la <b>división del trabajo</b>, las aldeas y, con el tiempo, las ciudades. También empezaron las diferencias entre ricos y pobres.'},
  {t:'La escritura, un gran invento',p:'Hace unos 5 000 años, en <b>Mesopotamia</b>, se escribió con signos en tablillas de barro (escritura <b>cuneiforme</b>). Primero sirvió para anotar cuentas: cosechas, impuestos y animales. Después sirvió para escribir leyes, órdenes y relatos. En Egipto usaron jeroglíficos sobre papiro. Con la escritura termina la Prehistoria y empieza la <b>Historia</b>. Los incas no tuvieron una escritura como la nuestra, pero registraban datos con los <b>quipus</b> (cuerdas con nudos).'},
  {t:'Para tu cuaderno: la línea del tiempo',wide:true,p:'Primeros humanos en África (herramientas y fuego) → salida de África y poblamiento de los continentes → agricultura y aldeas (Neolítico) → escritura (Mesopotamia).'}],
 qs:[
  {id:'1a',type:'order',kind:'Ordenamiento',pts:1.0,q:'Ordena estos hechos de más antiguo (1) a más reciente (4). Toca cada uno en ese orden.',
   items:['Las personas viven como nómadas, de la caza y la recolección','Se domestican plantas y animales','Se forman aldeas con excedentes de alimento','Los escribas anotan cuentas en tablillas de barro'],
   why:'Primero el nomadismo; luego se domestican plantas y animales; con eso aparecen aldeas y excedentes; y después la escritura, para llevar las cuentas.',
   x:'La palabra «Neolítico» significa «piedra nueva»: en esa época se pulió la piedra y apareció la cerámica.'},
  mc('1b',0.6,'Arqueólogos encuentran en la península de Santa Elena una vasija de la cultura Valdivia. Esa vasija es una fuente histórica…','material: es un objeto que dejaron las personas del pasado',['escrita: porque tiene dibujos','oral: porque se cuenta en voz alta','que no sirve, porque no tiene fecha'],
     'Las fuentes materiales son los objetos que dejaron las personas del pasado: vasijas, herramientas, casas, tumbas. Los arqueólogos las estudian para reconstruir cómo vivían.',
     'Valdivia es una de las culturas con cerámica más antigua de América.'),
  mc('1c',0.6,'Un compañero dice: «La historia solo sirve para memorizar fechas». ¿Qué respuesta es mejor?','La historia nos ayuda a entender por qué vivimos como vivimos y a decidir mejor hoy',['Tienes razón: el pasado ya no importa','La historia solo sirve para saber quién ganó las guerras','Solo sirve para estudiar a los reyes y a los héroes'],

  mc('1f',0.6,'Hace miles de años, un grupo humano aprende a tallar piedra y a cazar en equipo. ¿Qué consecuencia tuvo ese trabajo para la evolución humana?','Desarrolló la inteligencia, el lenguaje y la cooperación',['Los hizo depender de la escritura','Los obligó a vivir en ciudades','Hizo que dejaran de usar herramientas'],

  mc('1g',0.6,'Hace unos 10 000 años, muchas mujeres recolectaban semillas y frutos. ¿Cómo ayudó eso a que naciera la agricultura?','Al observar cómo crecían las plantas, aprendieron a sembrarlas y cuidarlas',['Escribieron las primeras leyes de las aldeas','Dirigieron los primeros ejércitos','Inventaron la cerámica para guerrear'],

  mc('1h',0.6,'¿Qué nos muestra la cultura Valdivia sobre el pasado del Ecuador?','Que hace más de 4 000 años ya había aldeas, cultivos y cerámica en nuestra costa',['Que antes de los incas no vivía nadie en el Ecuador','Que en la costa solo había cazadores nómadas','Que la escritura nació en el Ecuador'],

{id:'s2',n:2,name:'Sala de los Imperios',sub:'El gran mapa del museo',
 study:[
  {t:'¿Qué es un imperio?',p:'Un <b>imperio</b> es un territorio muy grande, con muchos pueblos, gobernado por un emperador o rey con mucho poder. Tiene un ejército, cobra impuestos y usa la escritura para administrar. En muchos imperios antiguos el trabajo de <b>esclavos</b> y campesinos sin derechos sostenía la riqueza de los poderosos.'},
  {t:'Mesopotamia: la tierra entre ríos',p:'Estaba entre el <b>Tigris y el Éufrates</b> (actual Irak). Con riego y canales produjeron excedentes y levantaron ciudades. Se sucedieron sumerios, acadios, babilonios y asirios. Escribían en <b>tablillas de barro</b>. El rey <b>Hammurabi</b> de Babilonia hizo escribir un código de leyes en una piedra; los castigos eran distintos según la clase social. Había esclavos por deudas o por guerra.'},
  {t:'Egipto: el regalo del Nilo',p:'Vivía de las crecidas anuales del <b>río Nilo</b>, que dejaban tierra fértil. El <b>faraón</b> era rey y considerado un dios. La sociedad era una pirámide: faraón, sacerdotes y nobles, escribas y soldados, campesinos y artesanos, y esclavos. Escribían con <b>jeroglíficos</b> sobre papiro, y levantaron pirámides y templos.'},
  {t:'China: ríos, emperador y muralla',p:'Nació junto a los ríos <b>Amarillo (Huang He) y Yangtsé</b>, donde cultivaban mijo y arroz. En el año 221 a. C., <b>Qin Shi Huang</b> unificó el país y fue su primer emperador; en su época se unieron muros para formar la Gran Muralla. Con la dinastía Han se difundió el <b>papel</b> y la seda por la Ruta de la Seda. El emperador gobernaba con funcionarios; abajo estaban los campesinos.'},
  {t:'India: valles, castas e imperios',p:'Las primeras ciudades surgieron en el valle del <b>Indo</b>; luego la vida se concentró en el <b>Ganges</b>. El emperador <b>Ashoka</b>, del imperio Maurya, después de una guerra muy cruel promovió el budismo y la no violencia. La sociedad se dividía en <b>castas</b>: brahmanes (sacerdotes y maestros), chatrias (guerreros y gobernantes), vaisias (comerciantes y agricultores) y sudras (servidores y trabajadores). Escribían en sánscrito.'},
  {t:'Roma: de ciudad a imperio',p:'Roma creció conquistando territorios con sus <b>legiones</b> y unió el Mediterráneo con <b>calzadas</b> (caminos de piedra). Los <b>latifundios</b> eran grandes haciendas trabajadas por esclavos. La sociedad tenía patricios, plebeyos y esclavos; los gladiadores eran casi siempre esclavos o prisioneros. Dejó el <b>latín</b> (de él viene el español), el derecho romano y obras como acueductos.'},
  {t:'Lo que tenían en común',p:'Aunque eran muy distintos, casi todos los imperios antiguos se parecían: dependían de la <b>agricultura</b>, usaban la <b>escritura</b>, tenían <b>ejércitos</b> poderosos, un gobernante con poder casi total (muchas veces apoyado en la religión) y una sociedad <b>desigual</b>, con una minoría poderosa y mucha gente sin derechos en la base.'},
  {t:'Para comparar bien',wide:true,p:'Compara siempre con los mismos criterios: <b>agricultura, escritura, ejército y desigualdad social</b>. En el Ecuador, la esclavitud se abolió en 1851; hoy la Constitución reconoce que todas las personas tenemos los mismos derechos.'}],
