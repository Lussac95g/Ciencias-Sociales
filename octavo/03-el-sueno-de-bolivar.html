<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3 · El sueño de Bolívar (Semana 10)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F4ECD9;--paper:#FFFBF1;--ink:#1E2A44;--muted:#566079;--terra:#B8472C;--aegean:#2A6F97;--olive:#566F2E;--gold:#D8A032;--line:#D8CBA9;--sea:#BFDCE8;--land:#EADFC2;--ok:#2B7F52;--okbg:#DDF1E4;--bad:#B8472C;--badbg:#F8E2DB;--warn:#8A5A00;--warnbg:#FFF1CC;--sel:#E4F0F6}
:root{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.5 Lexend,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.meander{height:14px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:repeating-linear-gradient(90deg,var(--ink) 0 14px,var(--gold) 14px 18px,var(--ink) 18px 32px,var(--bg) 32px 40px);opacity:.9}
#app{max-width:860px;margin:0 auto;padding:18px 0 56px}
h1,h2,h3{font-family:Cinzel,Georgia,"Times New Roman",serif;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,42px);letter-spacing:.5px}
h2{font-size:clamp(22px,4.6vw,30px)}
h3{font-size:21px}
p{margin:0}
.tag{display:inline-block;font:600 13px/1 Lexend,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--terra);border-radius:999px;padding:7px 12px}
.muted{color:var(--muted)}
.small{font-size:16px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:600 19px/1.2 Lexend,Arial,sans-serif;min-height:56px;padding:12px 22px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.alt:hover{background:var(--sel)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.go{background:var(--olive);border-color:var(--olive)}
.hero{display:flex;flex-direction:column;gap:12px;padding:8px 0 4px}
.hero p{font-size:20px}
.rules{display:grid;grid-template-columns:1fr;gap:10px;margin:0;padding:0;list-style:none}
.rules li{padding-left:34px;position:relative}
.rules li:before{content:"";position:absolute;left:4px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px #F3DFA8}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.rules{grid-template-columns:1fr}}
.sala{display:flex;flex-direction:column;gap:10px;border-left-width:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.sala:hover{background:#FFF6DF}
.sala .num{font:700 40px/1 Cinzel,Georgia,serif}
.sala .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sala .pts{font:600 15px Lexend,Arial,sans-serif;background:var(--land);border-radius:10px;padding:6px 10px;white-space:nowrap}
.bar{height:12px;background:var(--land);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:999px;transition:width .4s}
.c1{border-left-color:#B8472C}.c2{border-left-color:#2A6F97}.c3{border-left-color:#566F2E}.c4{border-left-color:#8A5A9E}.c5{border-left-color:#8A8A8A}
.n1{color:#B8472C}.n2{color:#2A6F97}.n3{color:#566F2E}.n4{color:#8A5A9E}.n5{color:#6C6C6C}
.top-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:16px;color:var(--muted)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font:600 14px/1 Lexend,Arial,sans-serif;background:var(--land);border-radius:999px;padding:7px 12px}
.chip.pts{background:#F3DFA8}
.prog{display:flex;gap:6px;margin:4px 0 16px}
.prog i{flex:1;height:10px;border-radius:6px;background:var(--line)}
.prog i.d{background:var(--olive)}.prog i.p{background:var(--gold)}.prog i.b{background:var(--terra)}.prog i.cur{outline:3px solid var(--ink);outline-offset:1px}
.qtext{font-size:21px;font-weight:500;margin-bottom:14px}
.ctx{background:var(--land);border-left:6px solid var(--gold);border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:500 19px/1.4 Lexend,Arial,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:56px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--aegean);background:var(--sel)}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--land);display:flex;align-items:center;justify-content:center;font:700 16px Lexend,Arial,sans-serif}
.opt.sel{border-color:var(--aegean);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}

.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:16px 18px;border-left:10px solid var(--line);background:var(--paper)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.part{background:var(--warnbg);border-color:var(--gold)}.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb h3{font-family:Lexend,Arial,sans-serif;font-size:19px;margin-bottom:6px}
.fb ul{margin:8px 0 0;padding-left:0;list-style:none}.fb ul li{margin-bottom:6px}.fb ol{margin:8px 0;padding-left:24px}
.fb .nb{margin-top:10px;font-size:16px;color:var(--muted)}
.tfrow{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:10px}
.tfrow:first-child{border-top:0;padding-top:0}
.tfbtns{display:flex;gap:10px}
.tfbtns .opt{justify-content:center;align-items:center}
.ord{display:flex;flex-direction:column;gap:10px}
.ord .opt{align-items:center}
.ord .opt b{width:40px;height:40px;font-size:20px;background:#fff;border:2px dashed var(--muted)}
.ord .opt.sel b{background:var(--aegean);color:#fff;border:2px solid var(--aegean)}
.ord .opt.ok b{background:var(--ok);color:#fff;border:2px solid var(--ok)}
.ord .opt.bad b{background:var(--bad);color:#fff;border:2px solid var(--bad)}
.sel-wrap{display:flex;flex-direction:column;gap:6px}
select{font:500 18px Lexend,Arial,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 10px;min-height:52px;width:100%;max-width:100%}
select.ok{border-color:var(--ok);background:var(--okbg)}select.bad{border-color:var(--bad);background:var(--badbg)}
.defs{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.defs li{display:flex;gap:10px;align-items:flex-start}
.defs b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--aegean);color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px Lexend,Arial,sans-serif}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
@media(min-width:600px){.mrow{grid-template-columns:1fr 1fr;align-items:center;gap:14px}}
.mrow label{font-weight:600}
.mapbox{border:2px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--land);margin-bottom:12px;-webkit-overflow-scrolling:touch}
.mapbox svg{display:block;width:100%;min-width:680px;height:auto}
.maphint{display:none}
@media(max-width:760px){.maphint{display:block}}
.cuadro .crit{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}

.cuadro .two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.cuadro .two{grid-template-columns:1fr 1fr;align-items:start}}
.cell{display:flex;flex-direction:column;gap:8px}
.cell .opt{font-size:17px;padding:10px 12px;min-height:48px}
.cell .opt b{width:28px;height:28px;font-size:14px}
.cuadro label{font-weight:600;font-size:16px;display:block;margin-bottom:4px}
textarea{font:400 18px/1.5 Lexend,Arial,sans-serif;width:100%;min-height:140px;border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);background:#fff;resize:vertical}
.model{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin-top:14px}
.model h3{font-family:Lexend,Arial,sans-serif;font-size:17px;margin-bottom:6px}
.crit-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.crit-list label{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.crit-list input{flex:none;width:26px;height:26px;margin-top:2px;accent-color:var(--olive)}
.navq{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.score{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px 16px}
.score .big{font:700 clamp(54px,14vw,88px)/1 Cinzel,Georgia,serif}
.level{display:inline-block;font-weight:700;border-radius:999px;padding:8px 16px;font-size:17px}
.lv-ok{background:var(--okbg);color:var(--ok)}.lv-part{background:var(--warnbg);color:var(--warn)}.lv-bad{background:var(--badbg);color:var(--bad)}
.res{display:flex;flex-direction:column;gap:10px}
.res .line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
details ul{margin:6px 0 0;padding-left:22px}
details li{margin-bottom:6px}
.miss{display:flex;flex-direction:column;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.miss button{font:500 16px Lexend,Arial,sans-serif;background:none;border:0;color:var(--aegean);text-decoration:underline;cursor:pointer;text-align:left;padding:4px 0;min-height:36px}
.sem{display:flex;gap:6px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;flex:none}
.d-v{background:var(--ok)}.d-a{background:var(--gold)}.d-r{background:var(--bad)}
.note-box{background:var(--warnbg);border-left:8px solid var(--gold);border-radius:12px;padding:14px 16px}
:focus-visible{outline:3px solid var(--aegean);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- estudio con nota ---- */
.study{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.study{grid-template-columns:1fr 1fr}}
.sc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sc h3{font-family:Lexend,Arial,sans-serif;font-size:19px;color:var(--ink)}
.sc h3 span{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);align-items:center;justify-content:center;font-size:15px;margin-right:8px;vertical-align:middle}
.sc p{font-size:18px}
.sc.wide{grid-column:1/-1;background:#FFF6DF;border-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:16px}
input[type=text]{font:500 19px Lexend,Arial,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:54px;width:100%}
.two2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.two2{grid-template-columns:2fr 1fr}}
.xtra{margin-top:10px;background:#fff;border:2px dashed var(--gold);border-radius:12px;padding:12px 14px;font-size:17px}
.sortbtns{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.sortbtns{grid-template-columns:1fr 1fr}}
.sortbtns .opt{justify-content:center;align-items:center;text-align:center}
.nota{border:3px solid var(--ink);border-radius:18px;background:var(--paper);overflow:hidden}
.nota .nh{background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;line-height:1.35;letter-spacing:.4px}
.nota .nb2{padding:16px;display:flex;flex-direction:column;gap:12px}
.nota .info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:17px}
.nota .info b{color:var(--muted);font-weight:600}
.nota .score{padding:6px 0}
.cap{border:3px dashed var(--terra);background:#FFF1EC;border-radius:14px;padding:14px 16px;font-weight:600;font-size:18px}
.hist{font-size:16px;color:var(--muted)}
.cardh{display:flex;gap:14px;align-items:center}
.cardh .num{font:700 40px/1 Cinzel,Georgia,serif}

.pp{white-space:nowrap;font-weight:500}
.rc{margin-top:8px;font-size:17px}
.nota .nb2{padding:14px;gap:10px}
.nota .nh{padding:10px 14px;font-size:13px}
.nota .info{font-size:16px;gap:2px 12px}
.nota .score{padding:0;gap:4px}
.nota .score .big{font-size:clamp(46px,13vw,76px)}
.nota h2{font-size:clamp(19px,5vw,26px)}
.cap{padding:12px 14px;font-size:16px;line-height:1.4}
/* respaldo para celulares que no soportan gap en flexbox */
.nogap .stack>*+*{margin-top:16px}
.nogap .opts>*+*,.nogap .ord>*+*,.nogap .sortbtns>*+*,.nogap .defs>*+*,.nogap .miss>*+*,.nogap .res>*+*,.nogap .cell>*+*,.nogap .crit>*+*,.nogap .tfrow>*+*,.nogap .sc>*+*{margin-top:10px}
.nogap .tfbtns>*+*{margin-left:10px}
.nogap .row>*,.nogap .navq>*,.nogap .qhead>*,.nogap .top-nav>*{margin:0 12px 12px 0}
.nogap .qhead>*{margin:0 8px 8px 0}
.nogap .grid>*{margin-bottom:14px}
.nogap .study>*{margin-bottom:12px}
.nogap .cardh>*+*{margin-left:14px}
.nogap .prog>*+*{margin-left:6px}
.nogap .field>*+*{margin-top:6px}
.nogap .two2>*{margin-bottom:12px}
.nogap .sala>*+*{margin-top:10px}
.nogap .opt>*+*{margin-left:12px}
.nogap .defs li>*+*{margin-left:10px}
.nogap .rules>*+*{margin-top:10px}
.nogap .hero>*+*{margin-top:12px}
@media (max-height:620px){
.nota .nb2{padding:10px 12px;gap:6px}
.nota .nh{padding:8px 12px;font-size:12px}
.nota .info{font-size:14px;gap:0 10px}
.nota .score .big{font-size:42px}
.nota h2{font-size:18px}
.cap{padding:8px 12px;font-size:14px;line-height:1.3}
}

.ghback{display:block;max-width:860px;margin:0 auto;padding:12px 0 0}
.ghback a{display:inline-block;font:600 16px Lexend,"Segoe UI",Arial,sans-serif;color:var(--ink);text-decoration:none;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:10px 16px}

<script>
/* El sueño de Bolívar · Estudio con nota · Semana 10 (Octavo EGB). Cada estación suma 10 puntos. */
function mc(id,pts,q,right,wrongs,why,x,ctx){return {id:id,type:'mc',kind:'Selección múltiple',pts:pts,q:q,ctx:ctx||'',o:[right].concat(wrongs),why:why,x:x||''}}
var PART={key:'bolivar_notas_v1',title:'El sueño de Bolívar',label:'Semana 10 · De la Gran Colombia a la integración',ST:[
{id:'b1',n:1,name:'El sueño de unir Sudamérica',sub:'De la Carta de Jamaica a la Gran Colombia',
 study:[
  {t:'¿Quién fue Simón Bolívar?',p:'Simón Bolívar nació en <b>Caracas</b> en 1783. Fue uno de los grandes líderes de la independencia: junto con otros jefes, como Antonio José de Sucre, ayudó a liberar los territorios de las actuales Venezuela, Colombia, Ecuador, Perú y Bolivia. Por eso se le llama «el Libertador».'},
  {t:'La Carta de Jamaica (1815)',p:'En 1815, desde Jamaica, Bolívar escribió una carta en la que imaginaba una <b>América libre y unida</b>. Pensaba que, si los nuevos países se unían, serían más fuertes para defender su libertad.'},
  {t:'Nace la Gran Colombia (1819)',p:'En <b>1819</b> se creó la <b>Gran Colombia</b>, una unión de territorios que eran parte del imperio español. Su capital era <b>Bogotá</b>. Con el tiempo se unieron los territorios de las actuales <b>Venezuela, Colombia, Ecuador y Panamá</b>.'},
  {t:'Quito se une en 1822',p:'El <b>24 de mayo de 1822</b>, en la <b>Batalla de Pichincha</b>, las fuerzas patriotas dirigidas por Sucre vencieron a los españoles y liberaron Quito. Desde entonces, el territorio del actual Ecuador formó parte de la Gran Colombia, como el «Distrito del Sur».'},
  {t:'El Congreso de Panamá (1826)',p:'En 1826, Bolívar invitó a las nuevas repúblicas a reunirse en <b>Panamá</b> para formar una alianza que las ayudara a <b>defenderse y cooperar</b>. Asistieron pocos países y el plan no se cumplió como él lo soñaba, pero fue un primer intento de integración.'},
  {t:'Para tu cuaderno: la línea del tiempo',wide:true,p:'<b>1815</b> Carta de Jamaica → <b>1819</b> nace la Gran Colombia → <b>1822</b> Batalla de Pichincha: Quito se une → <b>1826</b> Congreso de Panamá. Idea central: <b>unidos somos más fuertes</b>.'}],
 qs:[
  mc('1a',1.0,'¿Quién fue Simón Bolívar?','Un líder de la independencia que soñaba con unir a los países liberados de Sudamérica',['Un rey de España que gobernó América','Un presidente del Ecuador del siglo XX','Un pirata que atacaba los puertos'],
     'Bolívar lideró la lucha por la independencia y quería que los nuevos países permanecieran unidos.',
     'En su honor se llama «Bolivia» el país vecino del Perú.'),
  mc('1b',1.0,'¿Qué expresaba Bolívar en la Carta de Jamaica (1815)?','Su visión de una América libre y unida',['Una orden del rey de España','La rendición de su ejército','Un contrato para vender cacao'],
     'En esa carta imaginó el futuro de los países americanos y la importancia de la unión.',
     'Se escribió en Jamaica, una isla del mar Caribe.'),
  mc('1c',1.0,'¿En qué año se creó la Gran Colombia?','1819',['1492','1830','1980'],
     'La Gran Colombia nació en 1819 y su capital fue Bogotá.',
     'Desapareció poco más de una década después.'),
  mc('1d',1.0,'¿Qué territorios formaron la Gran Colombia?','Los de las actuales Venezuela, Colombia, Ecuador y Panamá',['Los de Perú, Bolivia, Chile y Argentina','Los de México, Cuba, Haití y Guatemala','Los de Brasil, Paraguay, Uruguay y Chile'],
     'Fue una unión de territorios del norte de Sudamérica y Panamá.',
     'Por eso el Ecuador y Colombia comparten tantas fiestas, comidas y costumbres.'),
  mc('1e',1.0,'En 1822, ¿qué batalla permitió liberar Quito y unirla a la Gran Colombia?','La Batalla de Pichincha, el 24 de mayo de 1822',['La Batalla de Waterloo','La Batalla de Stalingrado','La Batalla de Hastings'],
     'Sucre venció a los españoles en las faldas del volcán Pichincha.',
     'Cada 24 de mayo el Ecuador celebra esta victoria.'),
  mc('1f',1.0,'¿Para qué se convocó el Congreso de Panamá en 1826?','Para formar una alianza entre las nuevas repúblicas, para defenderse y cooperar',['Para declararle la guerra a Brasil','Para elegir a un nuevo rey','Para repartir las tierras de los siervos'],
     'Bolívar quería que las repúblicas actuaran juntas.',
     'Es considerado uno de los primeros intentos de integración latinoamericana.'),
  {id:'1g',type:'order',kind:'Ordenamiento',pts:1.0,q:'Ordena los hechos del más antiguo al más reciente (1 = el primero).',
   items:['Carta de Jamaica (1815)','Nace la Gran Colombia (1819)','Batalla de Pichincha (1822)','Congreso de Panamá (1826)'],
   why:'El orden es: 1815, 1819, 1822 y 1826.',
   x:'Entre la Carta de Jamaica y el Congreso de Panamá pasaron once años.'},
  {id:'1h',type:'tf',kind:'Verdadero o falso',pts:1.0,q:'Marca verdadero o falso en cada frase.',
   items:[

T.order=function(q,host,done,st){

  if(order.every(function(v,i){return v===i})){var t=order[0];order[0]=order[1];order[1]=t}
  var wrap=h('div',{class:'ord'});
  var check=h('button',{class:'btn',type:'button',disabled:true},['Comprobar']);
  var reset=h('button',{class:'btn alt',type:'button'},['Borrar mi orden']);
  function paint(){btns.forEach(function(b){var i=b._i;b.firstChild.textContent=num[i]?num[i]:'·';b.className='opt'+(num[i]?' sel':'')});check.disabled=num.indexOf(0)>=0}
  order.forEach(function(i){
    var b=h('button',{class:'opt',type:'button'},[h('b',{},['·']),h('span',{},[q.items[i]])]);b._i=i;
    b.onclick=function(){
      if(num[i]){var v=num[i];num[i]=0;for(var k=0;k<n;k++)if(num[k]>v)num[k]--;next--}else{num[i]=next;next++}
      paint()};
    btns.push(b);wrap.appendChild(b)});
  reset.onclick=function(){num=num.map(function(){return 0});next=1;paint()};
  check.onclick=function(){
    var good=0,k;for(k=0;k<n;k++)if(num[k]===k+1)good++;
    btns.forEach(function(b){b.disabled=true;b.className='opt '+(num[b._i]===b._i+1?'ok':'bad')});
    check.style.display='none';reset.style.display='none';
    var html='<p><b>Orden correcto:</b></p><ol>'+q.items.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol><p>'+q.why+'</p>';
    done(good/n,html)};
  host.appendChild(wrap);host.appendChild(h('div',{class:'row',style:'margin-top:12px'},[check,reset]))};

T.sort=function(q,host,done,st){
  var order=shuffle(seq(q.items.length),sd(st).seed+q.id),ans={},rows={};
  var check=h('button',{class:'btn',type:'button',disabled:true},['Comprobar']);
  var wrap=h('div');
  order.forEach(function(i){
    var it=q.items[i],bs=q.cats.map(function(c,k){
      var b=h('button',{class:'opt',type:'button'},[c]);
      b.onclick=function(){ans[i]=k;bs.forEach(function(x,j){x.className='opt'+(j===k?' sel':'')});check.disabled=Object.keys(ans).length<q.items.length};
      return b});
    rows[i]=bs;
    wrap.appendChild(h('div',{class:'tfrow'},[h('div',{},[it.t]),h('div',{class:'sortbtns'},bs)]))});
  check.onclick=function(){
    var ok=0,html='<ul>';
    q.items.forEach(function(it,i){var good=ans[i]===it.c;if(good)ok++;
      rows[i].forEach(function(b,k){b.disabled=true;if(k===it.c)b.className='opt ok';else if(k===ans[i])b.className='opt bad'});
      html+='<li>'+(good?'✔ ':'✖ ')+it.t+' → <b>'+q.cats[it.c]+'</b></li>'});
    check.style.display='none';
    done(ok/q.items.length,html+'</ul>'+(q.why?'<p>'+q.why+'</p>':''))};
  host.appendChild(wrap);host.appendChild(h('div',{class:'row',style:'margin-top:12px'},[check]))};

T.match=function(q,host,done){
  if(q.pre)host.appendChild(q.pre);
  if(q.defs){var ul=h('ul',{class:'defs'});q.defs.forEach(function(d){ul.appendChild(h('li',{},[h('b',{},[d.k]),h('span',{},[d.t])]))});host.appendChild(ul)}
  var sels=[],check=h('button',{class:'btn',type:'button',disabled:true},['Comprobar']);
  function upd(){check.disabled=sels.some(function(s){return !s.value})}
  var list=h('div');
  q.rows.forEach(function(r){
    var s=h('select',{'aria-label':r.t});s.appendChild(h('option',{value:''},['Elige una letra…']));
    q.letters.forEach(function(l){s.appendChild(h('option',{value:l},[l]))});
    s.onchange=upd;sels.push(s);
    list.appendChild(h('div',{class:'mrow'},[h('label',{},[r.t]),s]))});
  check.onclick=function(){
    var ok=0,html='<ul>';
    q.rows.forEach(function(r,i){var good=sels[i].value===r.a;if(good)ok++;sels[i].disabled=true;sels[i].className=good?'ok':'bad';
      html+='<li>'+(good?'✔ ':'✖ ')+'<b>'+r.t+'</b>: '+r.a+(good?'':' (elegiste '+sels[i].value+')')+'</li>'});
    check.style.display='none';
    done(ok/q.rows.length,html+'</ul>'+(q.why?'<p>'+q.why+'</p>':''))};
  host.appendChild(list);host.appendChild(h('div',{class:'row',style:'margin-top:12px'},[check]))};

T.map=function(q,host,done,st){

  q.pre=m;T.match(q,host,done,st)};
