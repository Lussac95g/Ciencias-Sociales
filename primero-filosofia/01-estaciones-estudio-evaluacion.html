<style>
/* Concepto: recorrido por estaciones, una tarjeta por pregunta, nota grande al final */
:root{--bg:#f3f3fa;--fg:#1d1b3a;--mut:#5b5a7a;--card:#ffffff;--line:#dcdaf0;--ac:#4338ca;--acfg:#fff;--ac2:#d98a00;--soft:#e9e7fb;--ok:#157347;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe7e5;--warn:#8a5a00;--warnbg:#fff1d6;
--fd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121226;--fg:#ecebff;--mut:#a3a2c8;--card:#1b1b36;--line:#2e2d52;--ac:#a5a0ff;--acfg:#14123a;--ac2:#f0b429;--soft:#26244f;--ok:#6ed19a;--okbg:#10301f;--bad:#ff9d94;--badbg:#3a1714;--warn:#f1c36b;--warnbg:#33260a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121226;--fg:#ecebff;--mut:#a3a2c8;--card:#1b1b36;--line:#2e2d52;--ac:#a5a0ff;--acfg:#14123a;--ac2:#f0b429;--soft:#26244f;--ok:#6ed19a;--okbg:#10301f;--bad:#ff9d94;--badbg:#3a1714;--warn:#f1c36b;--warnbg:#33260a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(23px,5vw,30px);font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:15px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:600 18px var(--fb);min-height:54px;border-radius:14px;border:0;background:var(--ac);color:var(--acfg);padding:12px 22px;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,select:focus-visible,input:focus-visible,.seg button:focus-visible,.mv button:focus-visible,.st:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>*{flex:1 1 220px}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
input,select{font:17px var(--fb);min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px;width:100%;min-width:0}
.sts{display:grid;gap:12px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font:inherit;color:inherit;width:100%}
.st:hover{border-color:var(--ac)}
.num{width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--ac);display:grid;place-items:center;font:800 21px var(--fd)}
.st .t{display:flex;flex-direction:column;gap:2px;min-width:0}.st .t b{font:600 18px var(--fd)}
.nota{font:800 26px var(--fd);color:var(--ac);white-space:nowrap}.nota small{font-size:14px;color:var(--mut);font-weight:600}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ac);white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tr{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.pts{align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ac)}
.q{font:600 20px/1.4 var(--fd)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 17px/1.4 var(--fb);text-align:left;min-height:54px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;width:100%}
.opt.sel{border-color:var(--ac);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.miss{border-color:var(--ok);border-style:dashed}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.row.ok{border-color:var(--ok);background:var(--okbg)}.row.bad{border-color:var(--bad);background:var(--badbg)}
.legend{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--soft);font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1 1 130px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:500 16px var(--fb);cursor:pointer;padding:8px}
.seg button.sel{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.ordrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.mv{display:flex;gap:6px}.mv button{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}.mv button:disabled{opacity:.3}
.fillp{line-height:2.4}.fillp select{width:auto;min-width:150px;display:inline-block;min-height:44px;margin-inline:4px}.fillp select.ok{border-color:var(--ok);background:var(--okbg)}.fillp select.bad{border-color:var(--bad);background:var(--badbg)}
.fb{padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg)}.fb.part{background:var(--warnbg);color:var(--warn)}
.fb.bad,.fb.ok,.fb.part{border:1px solid var(--line)}
.fb b{font-family:var(--fd);font-size:18px}.fb p{color:var(--fg);font-size:16px}
.know{padding:14px;border-radius:12px;background:var(--soft);font-size:16px}.know b{color:var(--ac)}
.repaso ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.cert{border:2px solid var(--ac);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--card);align-items:center;text-align:center}
.big{font:800 clamp(64px,22vw,110px)/1 var(--fd);color:var(--ac)}.big small{font-size:.32em;color:var(--mut)}
.scale{font-weight:600;padding:6px 14px;border-radius:99px;background:var(--soft);color:var(--ac)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;text-align:left;width:100%;max-width:420px}.meta dt{color:var(--mut)}.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.shot{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:14px;background:var(--warnbg);border:2px dashed var(--warn);color:var(--fg)}
.shot b{display:block;font-family:var(--fd);font-size:19px;margin-bottom:4px}.shot span.ico{font-size:30px;line-height:1}
.rev{display:flex;flex-direction:column;gap:8px}.rev div{display:flex;gap:10px;font-size:15px;align-items:flex-start}.rev .d{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.d.ok{background:var(--ok)}.d.bad{background:var(--bad)}.d.part{background:var(--warn)}
.tblw{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.card{padding:24px}.sts{grid-template-columns:1fr 1fr}.sts .st{grid-template-columns:auto 1fr}.sts .st .nota,.sts .st .pill{grid-column:2}}
</style>

<script>
const CFG={"key": "est-filo-1bgu", "title": "Estaciones de Filosofía", "eyebrow": "Filosofía · Primero BGU", "intro": "Repasa cada tema, practica con preguntas y consigue una nota sobre 10 en cada estación.", "how": ["Cada estación es un tema distinto y tiene su propia nota sobre 10.", "Lee el repaso, responde las preguntas y mira la explicación después de cada una.", "Al terminar verás tu nota. Puedes repetir la estación para mejorarla; vale el último intento.", "Toma una captura de pantalla de tu nota y envíala por la plataforma."], "asig": "Filosofía"};
/* constructores de preguntas */
const mc=(q,o,a,e,w=1)=>({t:"mc",q,o,a,e,w});
const multi=(q,o,a,e,w=1)=>({t:"multi",q,o,a,e,w});
const match=(q,l,r,a,e,w=1)=>({t:"match",q,l,r,a,e,w});
const classify=(q,cats,items,e,w=1)=>({t:"classify",q,cats,items,e,w});
const order=(q,items,e,w=1)=>({t:"order",q,items,e,w});
const fill=(q,_,a,bank,e,w=1)=>({t:"fill",q:"Completa el texto con las palabras de la lista.",text:q.replace(/^Completa:\s*/,""),a,bank,e,w});
const ST=[
{id:"f1",name:"La comunidad y el quehacer político",sub:"Formas de gobierno y bien común",
repaso:[
"Política: viene de «polis», la ciudad-Estado griega. Es el modo en que una comunidad decide cómo vivir juntos.",
"Comunidad: personas que comparten un territorio, reglas y fines comunes. Para vivir en comunidad hay que dialogar y decidir.",
"Quehacer político: identificar problemas comunes, deliberar, decidir y actuar por el bien de todos.",
"Formas de gobierno según quién gobierna: uno (monarquía), pocos (aristocracia) o muchos (democracia).",
"Cuando se gobierna solo en provecho propio, la forma se corrompe: tiranía (uno), oligarquía (pocos) y, para el historiador Polibio, oclocracia (la multitud movida por la pasión, sin razones).",
"Ecuador: la Constitución de 2008 dice que la soberanía radica en el pueblo, cuya voluntad es el fundamento de la autoridad."],
qs:[
mc("La palabra «política» viene del griego «polis». ¿Qué era la polis?",["La ciudad-Estado, una comunidad de ciudadanos que decidía sobre su vida común","Un templo donde se hacían sacrificios","Un ejército de ciudades aliadas","Un mercado de productos del campo"],0,"La polis era una pequeña ciudad independiente con sus propias leyes. De ahí vienen las palabras política, político y policía."),
match("Relaciona cada forma de gobierno con su descripción.",["Monarquía","Aristocracia","Democracia","Tiranía"],["Gobierno de uno solo que busca el bien de todos","Gobierno de unos pocos, los considerados mejores, en favor de todos","Gobierno de uno solo que impone su voluntad en provecho propio","Gobierno de los ciudadanos, de la mayoría"],[0,1,3,2],"Se distingue por cuántos gobiernan y para quién gobiernan. Un mismo número puede ser bueno o corrupto según busque el bien común o el provecho propio.",2),
classify("En un barrio de Cuenca ocurren estas situaciones. Clasifícalas.",["Quehacer político (bien común)","Va contra el bien común"],[["Los vecinos se reúnen para decidir cómo cuidar la quebrada del barrio.",0],["Un comité de padres de familia elige a su directiva con votos.",0],["Alguien se queda con el dinero de la junta de agua para gastarlo en lo suyo.",1],["Un grupo de estudiantes propone al consejo estudiantil un reglamento de convivencia.",0]],"El quehacer político no es solo de presidentes y asambleístas. Ocurre cada vez que una comunidad delibera y decide sobre algo que le importa a todos.",2),
mc("¿Qué diferencia a la aristocracia de la oligarquía?",["En ambas gobiernan los pocos, pero en la aristocracia buscan el bien común y en la oligarquía su propio provecho","La aristocracia es de uno solo y la oligarquía de muchos","La aristocracia es un gobierno de pobres y la oligarquía de ricos","No hay ninguna diferencia"],0,"La clave está en el fin: el mismo grupo reducido de personas puede gobernar bien o mal. Cuando gobiernan solo para sus intereses, la aristocracia se corrompe en oligarquía."),
multi("¿Cuáles son características de una comunidad política?",["Comparte un territorio y unas reglas","Toma decisiones sobre asuntos comunes","Todos sus miembros piensan exactamente igual","Busca fines que benefician a todos","No necesita dialogar para decidir"],[0,1,3],"Una comunidad no se define por pensar igual sino por convivir y decidir juntos. Por eso dialogar es indispensable."),
order("Ordena los pasos de un quehacer político en una comunidad.",["Se identifica un problema que afecta a todos","Se dialoga y se analizan las posibles soluciones","Se decide cuál solución se aplicará","Se ejecuta la decisión y se revisa si funcionó"],"Este recorrido (problema, deliberación, decisión y acción) se repite desde una asamblea barrial hasta un parlamento."),
fill("Completa: en una ___ gobiernan unos pocos buscando el bien común; si gobiernan solo para su provecho, se llama ___.","___",["aristocracia","oligarquía"],["aristocracia","oligarquía","monarquía","tiranía"],"Aristocracia significa «gobierno de los mejores» y oligarquía «gobierno de unos pocos». Es la misma estructura con un fin distinto.",1),
mc("Un gobernante impone su voluntad sin escuchar a nadie y solo busca su beneficio. ¿Qué forma de gobierno corrupta es esta?",["Tiranía","Aristocracia","Democracia","Monarquía justa"],0,"Tiranía es el gobierno de uno solo en provecho propio. La monarquía, en cambio, busca el bien de todos."),
mc("Según la Constitución del Ecuador de 2008, ¿dónde radica la soberanía?",["En el pueblo, cuya voluntad es el fundamento de la autoridad","En el presidente de la República","En las Fuerzas Armadas","En la Asamblea Nacional únicamente"],0,"Es el artículo 1 de la Constitución. La autoridad de los gobernantes viene de la voluntad popular y se ejerce por medio de los órganos del poder y de las formas de participación directa.")
]},
{id:"f2",name:"El ser humano, animal político",sub:"Aristóteles y la vida en comunidad",
repaso:[
"Aristóteles: filósofo griego (384–322 a. C.), discípulo de Platón y maestro de Alejandro Magno. Su obra «Política» estudia las ciudades.",
"Animal político (zoon politikon): el ser humano es por naturaleza un ser que necesita vivir con otros. Aislado no desarrolla lo mejor de sí.",
"Del hogar a la polis: la familia forma la aldea y varias aldeas forman la polis. La polis nace para vivir y existe para vivir bien.",
"El lenguaje (logos): otros animales tienen voz para señalar placer o dolor; el ser humano tiene palabra para expresar lo justo y lo injusto, lo útil y lo dañino.",
"Aristóteles dice que quien no puede vivir en sociedad o no la necesita es «bestia o dios».",
"Hoy: cuando un barrio exige un semáforo o una comunidad organiza una minga, actúa como animal político."],
qs:[
mc("¿Qué quiere decir Aristóteles cuando afirma que el ser humano es un «animal político»?",["Que por naturaleza necesita vivir en comunidad y deliberar con otros","Que todo ser humano debe ser candidato en elecciones","Que los humanos son agresivos como los animales","Que solo los gobernantes son políticos"],0,"«Político» viene de polis: el ser humano se realiza en la vida en común, no aislado."),
mc("Según Aristóteles, ¿qué distingue al ser humano de los demás animales sociales, como las abejas?",["El lenguaje, que le permite expresar lo justo y lo injusto","La fuerza física","El tamaño del cerebro","Que se alimenta de plantas y animales"],0,"Muchos animales viven en grupo, pero solo el ser humano usa el logos (palabra y razón) para discutir sobre lo justo, lo útil y lo dañino."),
classify("Indica si cada afirmación sobre el pensamiento de Aristóteles es verdadera o falsa.",["Verdadera","Falsa"],[["La polis existe solo para defenderse de los enemigos.",1],["Para Aristóteles, la polis nace para vivir y existe para vivir bien.",0],["Aristóteles escribió una obra llamada «Política».",0],["Un ser humano aislado se basta a sí mismo para desarrollarse plenamente.",1]],"La polis no es solo supervivencia: es la comunidad donde se alcanza una vida buena, con justicia y cultura.",2),
match("Relaciona cada término con su significado.",["Polis","Logos","Zoon politikon","Bien común"],["Palabra y razón, que permiten dialogar","Beneficio que alcanza a todos los miembros de la comunidad","Animal político","Ciudad-Estado griega"],[3,0,2,1],"Los cuatro términos forman una idea completa: animales políticos que, con logos, viven en la polis buscando el bien común.",2),
order("Ordena los niveles de comunidad que describe Aristóteles, del más pequeño al más grande.",["La familia o casa","La aldea","La polis"],"Para Aristóteles la comunidad crece por etapas: la familia satisface necesidades diarias, la aldea reúne familias y la polis permite una vida autosuficiente y buena."),
multi("¿Cuáles son ejemplos de vida política (participar en asuntos de la comunidad) en el Ecuador de hoy?",["Una asamblea comunitaria que decide cómo cuidar el páramo","Elegir al presidente o presidenta del curso","Pasar horas viendo videos sin hablar con nadie","Un cabildo en el que los vecinos piden una obra a su municipio"],[0,1,3],"Siempre que hay diálogo, decisión y asuntos comunes, hay vida política. Ver videos solo es una actividad privada."),
mc("Alguien dice: «yo no necesito a nadie, me basto solo». ¿Cómo lo vería Aristóteles?",["Como alguien que sería «bestia o dios», no un ser humano común","Como el mejor ciudadano posible","Como un filósofo perfecto","Como una persona sin problemas de convivencia"],0,"Para Aristóteles, quien no necesita de la comunidad es o menos que humano (bestia) o más que humano (dios). Los humanos nos necesitamos."),
fill("Completa: el ser humano es un animal ___ porque necesita la ___ y usa el ___ para dialogar.","___",["político","comunidad","lenguaje"],["político","comunidad","lenguaje","silencio","aislamiento"],"La naturaleza social y la capacidad de hablar van juntas: sin lenguaje no habría comunidad política.",1),
mc("En Quito, vecinos de un barrio se reúnen, discuten y acuerdan pedir al municipio un semáforo frente a la escuela. ¿Qué muestra esto?",["Que los seres humanos se organizan y deliberan para resolver problemas comunes","Que la política es solo cosa de presidentes","Que las leyes no sirven","Que el diálogo no cambia nada"],0,"Es un ejemplo cotidiano de lo que Aristóteles describía: personas que usan la palabra para decidir lo conveniente para todos.")
]},
{id:"f3",name:"Democracia en Atenas y democracia actual",sub:"Instituciones, exclusiones y participación en Ecuador",
repaso:[
"Atenas: la democracia ateniense se consolidó con las reformas de Clístenes (508 a. C.). Gobernaba «el pueblo» (demos) de forma directa.",
"Ekklesía: asamblea de ciudadanos que debatía y votaba, normalmente a mano alzada. Boulé: consejo de 500 miembros que preparaba los temas.",
"Isonomía: igualdad ante la ley. Isegoría: igualdad para hablar en la asamblea. Ostracismo: votación para desterrar por diez años a alguien considerado peligroso.",
"Quiénes eran ciudadanos: solo los varones adultos hijos de atenienses. Quedaban fuera las mujeres, los esclavizados, los metecos (extranjeros que vivían en Atenas) y los menores.",
"Democracia directa: el pueblo decide sin intermediarios. Democracia representativa: el pueblo elige representantes que deciden.",
"Hoy: derechos humanos y sufragio universal. En Ecuador el voto es obligatorio desde los 18 años y facultativo a los 16 y 17. Existen también consulta popular, revocatoria del mandato e iniciativa popular normativa."],
qs:[
match("Relaciona cada término de la democracia ateniense con su significado.",["Ekklesía","Boulé","Metecos","Isonomía","Ostracismo"],["Extranjeros que vivían en Atenas sin ser ciudadanos","Votación para desterrar a una persona por diez años","Igualdad ante la ley","Asamblea de ciudadanos que debatía y votaba","Consejo de 500 que preparaba los asuntos de la asamblea"],[3,4,0,2,1],"Estas instituciones muestran cómo funcionaba una democracia directa. Se participaba en persona, no por representantes.",2),
mc("En la Atenas democrática, ¿quién podía votar en la ekklesía?",["Los varones adultos hijos de atenienses","Todos los habitantes de la ciudad","Solo los generales","Los varones y las mujeres libres"],0,"La ciudadanía era restringida. Por eso, aunque se hablaba de «igualdad», una gran parte de la población quedaba excluida."),
multi("¿Quiénes estaban excluidos de la ciudadanía en Atenas?",["Las mujeres","Los metecos","Los esclavizados","Los varones adultos hijos de atenienses"],[0,1,2],"Los ciudadanos eran una minoría de la población total. La democracia ateniense fue una democracia para pocos."),
classify("¿A qué democracia corresponde cada característica?",["Atenas clásica","Ecuador actual"],[["Los ciudadanos votaban directamente las decisiones en una asamblea.",0],["Se eligen representantes en las urnas.",1],["Mujeres y personas de cualquier origen pueden votar.",1],["La esclavitud estaba permitida.",0],["Existe una Constitución que reconoce derechos humanos.",1],["Para participar había que ser varón adulto ateniense.",0]],"Comparar muestra avances: hoy el derecho a participar es mucho más amplio, aunque la participación real todavía enfrenta desigualdades.",3),
mc("¿Qué es la democracia directa?",["Aquella en la que los ciudadanos deciden por sí mismos, sin intermediarios","Aquella en la que gobierna un solo líder","Aquella en la que se eligen representantes","Aquella que no tiene leyes"],0,"Atenas es el ejemplo clásico. Hoy se usa en parte con mecanismos como la consulta popular."),

/* constructores de interfaz por tipo; devuelven {box,ready(),check(),lock()} */
function build(q){
  const box=el("div","rows");let done=false;
  if(q.t==="mc"){
    const op=shuffle(q.o);let sel=null;const ob=el("div","opts");const bs=[];
    op.forEach(([txt],k)=>{const b=el("button","opt",txt);b.type="button";b.onclick=()=>{if(done)return;sel=k;bs.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");ready()};bs.push(b);ob.append(b)});
    box.append(ob);
    return{box,get:()=>sel!==null,check:()=>{done=true;const ok=op[sel][1]===q.a;bs.forEach((b,k)=>{if(op[k][1]===q.a)b.classList.add("ok");else if(k===sel)b.classList.add("bad")});return{f:ok?1:0,note:ok?null:"Respuesta correcta: "+q.o[q.a]}}};
  }
  if(q.t==="multi"){
    const op=shuffle(q.o);const on=op.map(()=>false);const bs=[];const ob=el("div","opts");
    box.append(el("p","sm mut","Marca todas las que correspondan."));
    op.forEach(([txt],k)=>{const b=el("button","opt",txt);b.type="button";b.onclick=()=>{if(done)return;on[k]=!on[k];b.classList.toggle("sel",on[k]);ready()};bs.push(b);ob.append(b)});
    box.append(ob);
    return{box,get:()=>on.some(Boolean),check:()=>{done=true;let right=0,wrong=0,miss=[];op.forEach(([txt,orig],k)=>{const ok=q.a.includes(orig);bs[k].classList.remove("sel");if(ok&&on[k]){right++;bs[k].classList.add("ok")}else if(ok){miss.push(txt);bs[k].classList.add("miss")}else if(on[k]){wrong++;bs[k].classList.add("bad")}});const f=Math.max(0,(right-wrong)/q.a.length);return{f,note:miss.length?"Faltó marcar: "+miss.join("; "):(wrong?"Marcaste opciones que no corresponden.":null)}}};
  }
  if(q.t==="match"){
    const lg=el("div","legend");q.r.forEach((t,k)=>lg.append(el("span",null,LET[k]+") "+t)));box.append(lg);
    const sels=[],rows=[];
    q.l.forEach((t,k)=>{const r=el("div","row");r.append(el("span",null,(k+1)+". "+t));const s=el("select");s.id="m"+run.i+"_"+run.k+"_"+k;s.setAttribute("aria-label","Respuesta para "+t);const o0=el("option",null,"Elige");o0.value="";s.append(o0);q.r.forEach((_,j)=>{const o=el("option",null,LET[j]+")");o.value=j;s.append(o)});s.onchange=()=>ready();r.append(s);sels.push(s);rows.push(r);box.append(r)});
    return{box,get:()=>sels.every(s=>s.value!==""),check:()=>{done=true;let n=0;sels.forEach((s,k)=>{s.disabled=true;const ok=+s.value===q.a[k];if(ok)n++;rows[k].classList.add(ok?"ok":"bad");if(!ok){const c=el("span","sm","Correcta: "+LET[q.a[k]]+") "+q.r[q.a[k]]);c.style.fontWeight="600";rows[k].append(c)}});return{f:n/q.l.length,note:null}}};
  }
  if(q.t==="classify"){
    const pick=q.items.map(()=>null),rows=[];
    q.items.forEach(([t,a],k)=>{const r=el("div","row");r.append(el("span",null,t));const sg=el("div","seg");q.cats.forEach((c,j)=>{const b=el("button",null,c);b.type="button";b.onclick=()=>{if(done)return;pick[k]=j;[...sg.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");ready()};sg.append(b)});r.append(sg);rows.push(r);box.append(r)});
    return{box,get:()=>pick.every(p=>p!==null),check:()=>{done=true;let n=0;q.items.forEach(([t,a],k)=>{const ok=pick[k]===a;if(ok)n++;rows[k].classList.add(ok?"ok":"bad");if(!ok){const c=el("span","sm","Correcta: "+q.cats[a]);c.style.fontWeight="600";rows[k].append(c)}});return{f:n/q.items.length,note:null}}};
  }
  if(q.t==="order"){
    let ord=shuffle(q.items).map(x=>x[0]);const list=el("div","rows");box.append(el("p","sm mut","Usa las flechas para poner el orden correcto, del primero al último."));
    const draw=()=>{list.replaceChildren();ord.forEach((v,pos)=>{const r=el("div","row ordrow");r.append(el("b",null,String(pos+1)),el("span",null,v));if(!done){const mv=el("div","mv"),u=el("button",null,"▲"),d=el("button",null,"▼");u.type=d.type="button";u.setAttribute("aria-label","Subir");d.setAttribute("aria-label","Bajar");u.disabled=pos===0;d.disabled=pos===ord.length-1;u.onclick=()=>{[ord[pos-1],ord[pos]]=[ord[pos],ord[pos-1]];draw()};d.onclick=()=>{[ord[pos+1],ord[pos]]=[ord[pos],ord[pos+1]];draw()};mv.append(u,d);r.append(mv)}list.append(r)})};
    draw();box.append(list);
    return{box,get:()=>true,check:()=>{done=true;let n=0;const rs=[...list.children];ord.forEach((v,pos)=>{const ok=v===q.items[pos];if(ok)n++;rs[pos].classList.add(ok?"ok":"bad")});draw();const rs2=[...list.children];ord.forEach((v,pos)=>rs2[pos].classList.add(v===q.items[pos]?"ok":"bad"));return{f:n/q.items.length,note:n<q.items.length?"Orden correcto: "+q.items.map((x,i)=>(i+1)+") "+x).join("  ·  "):null}}};
  }
  if(q.t==="fill"){
    box.append(Object.assign(el("div","legend"),{textContent:"Palabras disponibles: "+q.bank.join(" · ")}));
    const p=el("p","fillp");const sels=[];const parts=q.text.split("___");

  }
}

  btn.onclick=()=>{
    if(btn.dataset.done){if(run.k===s.qs.length-1)result();else{run.k++;render()}return}
    const r=B.check();btn.dataset.done="1";run.res.push({f:r.f,w:q.w,q:q.q});
    const cls=r.f>=0.999?"ok":r.f>0?"part":"bad";
    const fb=el("div","fb "+cls);fb.append(el("b",null,cls==="ok"?"¡Correcto! +"+fmt(pv)+" pts":cls==="part"?"Casi. +"+fmt(pv*r.f)+" de "+fmt(pv)+" pts":"Todavía no. +0 pts"));
    if(r.note)fb.append(el("p",null,r.note));
    const kn=el("div","know");kn.append(Object.assign(el("b"),{textContent:"Para recordar: "}),document.createTextNode(q.e));
    fbw.append(fb,kn);
    btn.textContent=run.k===s.qs.length-1?"Ver mi nota":"Siguiente";btn.disabled=false;btn.scrollIntoView({block:"nearest",behavior:"smooth"});
  };
  app.append(top,card,fbw,btn);
}
/* resultado */
function result(){
  const s=ST[run.i];const earned=run.res.reduce((a,r)=>a+r.w*r.f,0);
  const nota=Math.round(10*earned/run.tw*100)/100;
  const prev=S[s.id];const intento=(prev?prev.intento:0)+1;
  const now=new Date();const fecha=now.toLocaleString("es-EC",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  S[s.id]={nota,intento,fecha};save();
  try{if(window.registrarNota)registrarNota({curso:"1.º BGU Filosofía",grupo:String(U.curso).replace(/^1 BGU\s*/,""),evaluacion:s.name,nombre:U.name,nota,intento})}catch(_e){}
  app.replaceChildren();window.scrollTo(0,0);
  const h=el("div");h.style.cssText="display:flex;flex-direction:column;gap:6px;padding-top:12px";
  h.append(el("span","eyebrow","Estación "+(run.i+1)+" terminada"),el("h2",null,s.name));
  const cert=el("div","cert");cert.append(el("span","eyebrow",CFG.asig+" · Primero BGU"));
  const big=el("div","big");big.append(document.createTextNode(fmt(nota)),Object.assign(el("small"),{textContent:" / 10"}));
  cert.append(big,el("span","scale",scale(nota)));
  const dl=el("dl","meta");[["Estudiante",U.name],["Paralelo",U.curso],["Estación",(run.i+1)+". "+s.name],["Intento",String(intento)],["Fecha y hora",fecha]].forEach(([a,b])=>{dl.append(el("dt",null,a),el("dd",null,b))});cert.append(dl);
  const shot=el("div","shot");const ico=el("span","ico","📸");const tx=el("div");tx.append(el("b",null,"Toma una captura de pantalla de esta nota"),el("span",null,"Envíala por la plataforma. Debe verse tu nombre, la estación, la nota y la fecha."));shot.append(ico,tx);
  const rv=el("div","card");rv.append(el("h3",null,"Cómo te fue en cada pregunta"));
  const rl=el("div","rev");run.res.forEach((r,k)=>{const d=el("div");const c=r.f>=0.999?"ok":r.f>0?"part":"bad";d.append(Object.assign(el("span","d "+c)),el("span",null,(k+1)+". "+r.q));rl.append(d)});rv.append(rl);
  rv.append(el("p","sm mut","Verde: bien. Amarillo: a medias. Rojo: para repasar. Puedes repetir la estación para mejorar tu nota; vale el último intento."));
  const again=el("button","btn alt","Repetir esta estación");again.type="button";again.onclick=()=>intro(run.i);
  const back=el("button","btn","Volver a las estaciones");back.type="button";back.onclick=home;
  app.append(h,cert,shot,rv,again,back);
}
home();
</script>
